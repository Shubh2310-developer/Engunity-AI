name: Lighthouse CI

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to audit'
        required: true

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            ${{ inputs.url }}
          uploadArtifacts: true
