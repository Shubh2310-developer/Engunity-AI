name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  backend-tests:
    name: Backend (Python) Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend dependencies
        if: hashFiles('backend/requirements*.txt') != ''
        run: |
          python -m pip install --upgrade pip
          # Install the most complete requirements file available, fallback to requirements.txt
          if [ -f backend/requirements_ultimate_v4.txt ]; then pip install -r backend/requirements_ultimate_v4.txt; 
          elif [ -f backend/requirements_ultimate_rag.txt ]; then pip install -r backend/requirements_ultimate_rag.txt; 
          elif [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; 
          else echo "No backend requirements file found"; fi

      - name: Run unit tests (pytest)
        if: hashFiles('backend/tests/**') != ''
        working-directory: backend
        run: |
          pytest -q || pytest -q -k ""

  frontend-tests:
    name: Frontend (Node) Build & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run tests (if present)
        working-directory: frontend
        run: |
          npm test --if-present

      - name: Build (if present)
        working-directory: frontend
        run: |
          npm run build --if-present
