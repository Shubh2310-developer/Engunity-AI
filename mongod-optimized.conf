# MongoDB Optimized Configuration for Low Memory Systems
# Copy to /etc/mongod.conf with: sudo cp mongod-optimized.conf /etc/mongod.conf
# Then restart: sudo systemctl restart mongod

storage:
  dbPath: /var/lib/mongodb
  engine: wiredTiger
  wiredTiger:
    engineConfig:
      # Reduce cache size from default 50% to 256MB
      cacheSizeGB: 0.25
      # Disable journal for development (faster, less memory)
      journalCompressor: snappy
    collectionConfig:
      blockCompressor: snappy

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log
  # Reduce logging verbosity
  verbosity: 0

net:
  port: 27017
  bindIp: 127.0.0.1
  # Reduce max connections
  maxIncomingConnections: 100

processManagement:
  timeZoneInfo: /usr/share/zoneinfo

# Optimize for low memory
setParameter:
  # Reduce cursor timeout
  cursorTimeoutMillis: 60000
  # Reduce internal query buffer
  internalQueryExecMaxBlockingSortBytes: 33554432
